[project]
name = "observability-agent"
version = "0.1.0"
description = "Observability Agent POC with MCP servers for OpenSearch and Grafana"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=0.1.0",
    "strands-agents-tools>=0.1.0",
    "mcp>=1.0.0",
    "opensearch-py>=2.4.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "bedrock-agentcore>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
